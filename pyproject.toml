[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-mp-export"
version = "0.1.0"
description = "Generic WeChat Official Account (微信公众号) full-history article & media exporter with Markdown/HTML offline archive and optional Halo 2.x importer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["wechat", "official-account", "mp", "archive", "markdown", "exporter", "halo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40.0",
]
halo = [
    "cryptography>=41.0.0",
]
dev = [
    "pytest>=7.4.0",
]

[project.urls]
Homepage = "https://github.com/qiao-y/wechat-mp-export"
Repository = "https://github.com/qiao-y/wechat-mp-export.git"
Issues = "https://github.com/qiao-y/wechat-mp-export/issues"

[project.scripts]
wechat-mp-export = "wechat_mp_export.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
